{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "goscape.fullname" . }}
  labels:
    {{- include "goscape.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "goscape.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if eq .Values.deploymentMode "Management" }}
    # Allow gRPC only from goscape world/single-binary pods in this namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "goscape.name" . }}
      ports:
        - port: {{ .Values.goscape.ports.loginGRPC }}
          protocol: TCP
        - port: {{ .Values.goscape.ports.friendsGRPC }}
          protocol: TCP
    {{- else }}
    # Allow client-facing ports from anywhere
    - ports:
        - port: {{ .Values.goscape.ports.ondemandHTTP }}
          protocol: TCP
        - port: {{ .Values.goscape.ports.worldTCP }}
          protocol: TCP
    {{- end }}
    {{- if or (eq .Values.deploymentMode "SingleBinary") (eq .Values.deploymentMode "Management") }}
    # Hiscore API. When Kong config is rendered, only the Kong proxy pods may
    # reach the port directly (SEC1 M-12: otherwise any in-cluster client can
    # skip key-auth + rate limits). Without Kong it stays open like the other
    # client-facing ports.
    - {{- if .Values.hiscoreGateway.createGatewayConfig }}
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.hiscoreGateway.proxyNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.hiscoreGateway.proxyPodSelector | nindent 14 }}
      {{- end }}
      ports:
        - port: {{ .Values.goscape.ports.hiscoreHTTP }}
          protocol: TCP
    {{- end }}
    {{- if and .Values.goscape.account.enabled (or (eq .Values.deploymentMode "SingleBinary") (eq .Values.deploymentMode "Management")) }}
    # Account portal. Browser-facing like the ondemand port, so it is open;
    # the AccountService gRPC port needs no rule, because login reaches it
    # from inside this same pod and same-pod traffic is not subject to policy.
    - ports:
        - port: {{ .Values.goscape.ports.accountHTTP }}
          protocol: TCP
    {{- end }}
{{- end }}
