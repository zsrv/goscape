{{- $mode := .Values.deploymentMode -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goscape.fullname" . }}
  labels:
    {{- include "goscape.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "goscape.selectorLabels" . | nindent 4 }}
  ports:
    {{- if or (eq $mode "SingleBinary") (eq $mode "World") }}
    - name: ondemand-http
      port: {{ .Values.goscape.ports.ondemandHTTP }}
      targetPort: ondemand-http
      protocol: TCP
    - name: world-tcp
      port: {{ .Values.goscape.ports.worldTCP }}
      targetPort: world-tcp
      protocol: TCP
    {{- end }}
    {{- if eq $mode "Management" }}
    - name: login-grpc
      port: {{ .Values.goscape.ports.loginGRPC }}
      targetPort: login-grpc
      protocol: TCP
    - name: friends-grpc
      port: {{ .Values.goscape.ports.friendsGRPC }}
      targetPort: friends-grpc
      protocol: TCP
    {{- end }}
    {{- if or (eq $mode "SingleBinary") (eq $mode "Management") }}
    - name: hiscore-http
      port: {{ .Values.goscape.ports.hiscoreHTTP }}
      targetPort: hiscore-http
      protocol: TCP
    {{- if .Values.goscape.account.enabled }}
    {{- /* Portal only. AccountService gRPC is deliberately absent: login
           reaches it over loopback inside this same pod in both stateful
           modes, so a Service port would widen the admin surface (guarded
           by a bearer token alone) for no in-cluster consumer. Reach it with
           `kubectl port-forward` for `goscape-cli account`. */}}
    - name: account-http
      port: {{ .Values.goscape.ports.accountHTTP }}
      targetPort: account-http
      protocol: TCP
    {{- end }}
    {{- end }}
{{- if or (eq $mode "SingleBinary") (eq $mode "Management") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goscape.fullname" . }}-headless
  labels:
    {{- include "goscape.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "goscape.selectorLabels" . | nindent 4 }}
  ports:
    {{- if eq $mode "SingleBinary" }}
    - name: world-tcp
      port: {{ .Values.goscape.ports.worldTCP }}
      targetPort: world-tcp
      protocol: TCP
    {{- end }}
    {{- if eq $mode "Management" }}
    - name: login-grpc
      port: {{ .Values.goscape.ports.loginGRPC }}
      targetPort: login-grpc
      protocol: TCP
    - name: friends-grpc
      port: {{ .Values.goscape.ports.friendsGRPC }}
      targetPort: friends-grpc
      protocol: TCP
    {{- end }}
{{- end }}
