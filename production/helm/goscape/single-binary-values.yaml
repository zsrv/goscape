---
# Run ondemand + world + login + friends + hiscore in one StatefulSet.
# (The account module is not rendered by this chart; see the chart README.)
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: "900MiB"

persistence:
  enabled: true
  size: 5Gi

service:
  type: ClusterIP
