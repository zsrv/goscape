# -- Deployment role for this release: SingleBinary | Management | World
deploymentMode: SingleBinary

# -- Override the chart name portion of resource names
nameOverride: ""
# -- Override the full resource name
fullnameOverride: ""
# -- Labels added to every resource
commonLabels: {}
# -- Annotations added to every resource
commonAnnotations: {}

image:
  # -- Image registry. Leave empty to omit the registry prefix.
  registry: docker.io
  # -- Image repository
  repository: goscape/goscape
  # -- Image tag. Defaults to the chart appVersion when empty.
  tag: ""
  # -- Image digest (sha256:...). When set, the image is pinned by digest and tag is ignored.
  digest: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image pull secrets
  pullSecrets: []

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Name of the ServiceAccount; generated when empty
  name: ""
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- goscape never talks to the Kubernetes API; keep the token unmounted.
  automountServiceAccountToken: false

# goscape application config (rendered into config.yaml)
goscape:
  # -- Log level: debug | info | warn | error
  logLevel: info
  # -- Log format: text | json
  logFormat: json
  # -- Path to the baked-in packed cache (must match the image)
  cachePath: /usr/share/goscape/pack
  # -- Data dir for stateful modes (central sqlite DB + player saves)
  dataPath: /var/lib/goscape
  ports:
    # -- ondemand HTTP container port
    ondemandHTTP: 8080
    # -- world TCP container port
    worldTCP: 43594
    # -- login gRPC container port
    loginGRPC: 2004
    # -- friends gRPC container port
    friendsGRPC: 2005
    # -- hiscore API HTTP container port
    hiscoreHTTP: 8082
  node:
    # -- World id (World / SingleBinary modes)
    id: 1
    # -- Whether members content is available
    members: true
    # -- Node profile name
    profile: main
  # -- World mode only: address of the Management login gRPC, e.g. goscape-mgmt:2004
  loginServerAddress: ""
  # -- World mode only: address of the Management friends gRPC, e.g. goscape-mgmt:2005
  friendsServerAddress: ""
  # -- Free-form map deep-merged over the generated config.yaml (escape hatch for any flag)
  extraConfig: {}
  # -- RSA private key the world server uses to decrypt RuneScape login packets
  #    (World / SingleBinary modes; sets world.rsa_private_key_path). Leave
  #    existingSecret empty to use the built-in default key. The Java client must
  #    carry the matching public key (Client.java LOGIN_RSAN / LOGIN_RSAE).
  #    Generate a keypair with `goscape-cli rsa gen`.
  loginRsaKey:
    # -- Name of an existing Secret holding the PEM-encoded RSA private key (PKCS#1 or PKCS#8). Empty disables the feature.
    existingSecret: ""
    # -- Key within existingSecret holding the PEM.
    key: private.pem
  # -- Central database (Management / SingleBinary modes; sets database.*)
  database:
    # -- Central database backend: sqlite | postgres
    backend: sqlite
    postgres:
      # -- PostgreSQL host (required when backend=postgres)
      host: ""
      # -- PostgreSQL port
      port: 5432
      # -- Database name
      database: goscape
      # -- Database user
      user: goscape
      # -- Existing Secret holding the database password (required when backend=postgres)
      existingSecret: ""
      # -- Key in existingSecret containing the password (a key name, not a credential)
      secretKey: password
      # -- sslmode for the DSN. `prefer` negotiates TLS when the server
      # supports it and falls back to cleartext otherwise; set `require`
      # (or stricter) for hardened deployments, `disable` to force cleartext.
      sslmode: prefer

# Workload knobs for SingleBinary mode
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # -- The world process fills to its GC ceiling at ~1.1-1.3Gi under load; 2Gi leaves headroom.
      memory: 2Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  # -- Liveness probe: tcpSocket on the primary port (world-tcp, or login-grpc
  #    in Management). /healthz is deliberately NOT used for liveness — it
  #    returns 503 during a slow cold-cache boot and must not restart the pod.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
  extraEnv: []
  extraArgs: []

# Workload knobs for Management mode
management:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # -- The world process fills to its GC ceiling at ~1.1-1.3Gi under load; 2Gi leaves headroom.
      memory: 2Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  # -- Liveness probe: tcpSocket on the primary port (world-tcp, or login-grpc
  #    in Management). /healthz is deliberately NOT used for liveness — it
  #    returns 503 during a slow cold-cache boot and must not restart the pod.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
  extraEnv: []
  extraArgs: []

# Workload knobs for World mode
world:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # -- The world process fills to its GC ceiling at ~1.1-1.3Gi under load; 2Gi leaves headroom.
      memory: 2Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  # -- Liveness probe: tcpSocket on the primary port (world-tcp, or login-grpc
  #    in Management). /healthz is deliberately NOT used for liveness — it
  #    returns 503 during a slow cold-cache boot and must not restart the pod.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
  extraEnv: []
  extraArgs: []

# Persistent storage (Management + SingleBinary)
persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  annotations: {}

service:
  # -- Service type for the primary Service of this release
  type: ClusterIP
  # -- Annotations for the Service
  annotations: {}

# Ingress for the ondemand HTTP endpoint (SingleBinary / World)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

networkPolicy:
  enabled: false

# Arbitrary extra manifests rendered verbatim (list of objects or template strings)
extraManifests: []

# Kong gateway configuration for the hiscores API.
#
# This renders Kong Ingress Controller CONFIGURATION only (Ingress,
# KongPlugin, KongConsumer). It does NOT install Kong. Kong is a
# prerequisite, installed separately from its own chart, because a
# gateway is cluster-wide infrastructure shared by every service behind
# it rather than a per-application component.
hiscoreGateway:
  createGatewayConfig: false
  host: ""
  ingressClassName: kong
  # When createGatewayConfig is true and networkPolicy.enabled is true, the
  # hiscore port is reachable only from the Kong proxy pods matched below, so
  # in-cluster callers cannot bypass key-auth and rate limits.
  proxyNamespace: kong
  proxyPodSelector:
    app.kubernetes.io/name: kong
  # Consumer used for unauthenticated callers (the website, casual
  # users). key-auth falls back to it instead of rejecting, because
  # hiscore data is public — keys exist for quota and accountability.
  anonymousConsumer: hiscore-anonymous
  rateLimit:
    anonymousPerMinute: 60
    consumerPerMinute: 600
  cacheTTLSeconds: 60
  corsOrigins: []
  # Third-party consumers. Each entry names an EXISTING Secret holding
  # the key-auth credential; key material never lives in values.yaml.
  #   - username: partner-a
  #     credentialSecret: hiscore-partner-a-key
  consumers: []
