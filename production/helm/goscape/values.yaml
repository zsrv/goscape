# -- Deployment role for this release: SingleBinary | Management | World
deploymentMode: SingleBinary

# -- Override the chart name portion of resource names
nameOverride: ""
# -- Override the full resource name
fullnameOverride: ""
# -- Labels added to every resource
commonLabels: {}
# -- Annotations added to every resource
commonAnnotations: {}

image:
  # -- Image registry. Leave empty to omit the registry prefix.
  registry: docker.io
  # -- Image repository
  repository: goscape/goscape
  # -- Image tag. Defaults to the chart appVersion when empty.
  tag: ""
  # -- Image digest (sha256:...). When set, the image is pinned by digest and tag is ignored.
  digest: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image pull secrets
  pullSecrets: []

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Name of the ServiceAccount; generated when empty
  name: ""
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- goscape never talks to the Kubernetes API; keep the token unmounted.
  automountServiceAccountToken: false

# goscape application config (rendered into config.yaml)
goscape:
  # -- Log level: debug | info | warn | error
  logLevel: info
  # -- Log format: text | json
  logFormat: json
  # -- Path to the baked-in packed cache (must match the image)
  cachePath: /usr/share/goscape/pack
  # -- Data dir for stateful modes (central sqlite DB + player saves)
  dataPath: /var/lib/goscape
  ports:
    # -- ondemand HTTP container port
    ondemandHTTP: 8080
    # -- world TCP container port
    worldTCP: 43594
    # -- login gRPC container port
    loginGRPC: 2004
    # -- friends gRPC container port
    friendsGRPC: 2005
    # -- hiscore API HTTP container port
    hiscoreHTTP: 8082
    # -- account portal HTTP container port
    accountHTTP: 8081
    # -- account AccountService gRPC container port
    accountGRPC: 2006
  node:
    # -- World id (World / SingleBinary modes)
    id: 1
    # -- Whether members content is available
    members: true
    # -- Node profile name
    profile: main
    # -- Engine debug mode (TS Environment.NODE_DEBUG), rendered into both
    # world.node_debug and ondemand.node_debug. It sends players extra debug
    # info such as missing-trigger messages, so this chart turns it off: the
    # engine's own default is true, which suits development, not a public
    # server. Set it true if you serve the Java applet — /rs2.cgi only answers
    # `plugin=1` with the applet bootstrap while debug is on.
    debug: false
  # -- World mode only: address of the Management login gRPC, e.g. goscape-mgmt:2004
  loginServerAddress: ""
  # -- World mode only: address of the Management friends gRPC, e.g. goscape-mgmt:2005
  friendsServerAddress: ""
  # -- Free-form map deep-merged over the generated config.yaml (escape hatch for any flag)
  extraConfig: {}
  # -- RSA private key the world server uses to decrypt RuneScape login packets
  #    (World / SingleBinary modes; sets world.rsa_private_key_path). Leave
  #    existingSecret empty to use the built-in default key. The Java client must
  #    carry the matching public key (Client.java LOGIN_RSAN / LOGIN_RSAE).
  #    Generate a keypair with `goscape-cli rsa gen`.
  loginRsaKey:
    # -- Name of an existing Secret holding the PEM-encoded RSA private key (PKCS#1 or PKCS#8). Empty disables the feature.
    existingSecret: ""
    # -- Key within existingSecret holding the PEM.
    key: private.pem
  # -- Central database (Management / SingleBinary modes; sets database.*)
  database:
    # -- Central database backend: sqlite | postgres
    backend: sqlite
    postgres:
      # -- PostgreSQL host (required when backend=postgres)
      host: ""
      # -- PostgreSQL port
      port: 5432
      # -- Database name
      database: goscape
      # -- Database user
      user: goscape
      # -- Existing Secret holding the database password (required when backend=postgres)
      existingSecret: ""
      # -- Key in existingSecret containing the password (a key name, not a credential)
      secretKey: password
      # -- sslmode for the DSN. `prefer` negotiates TLS when the server
      # supports it and falls back to cleartext otherwise; set `require`
      # (or stricter) for hardened deployments, `disable` to force cleartext.
      sslmode: prefer

  # -- Account module: player portal (HTTP) + AccountService gRPC
  #    (Management / SingleBinary modes; sets account.*). Off by default:
  #    unlike the other modules the portal cannot run on defaults alone, since
  #    publicUrl has no sensible default and the module refuses to start
  #    without it. Settings without a key here (argon2 cost, session TTLs) go
  #    in goscape.extraConfig.
  account:
    # -- Run the player portal and AccountService
    enabled: false
    # -- Externally reachable portal base URL, no trailing slash. Used in
    # verification/reset email links and as the OAuth redirect base, so it must
    # be the address players actually reach — required when enabled.
    publicUrl: ""
    # -- Maximum characters per portal account
    characterLimit: 5
    gate:
      # -- Character creation requires a linked identity from one of these
      # providers, or membership of the manually_approved group. Empty means
      # manual approval is the only route.
      providers:
        - discord
    smtp:
      # -- SMTP relay host. Empty disables outbound mail and logs the links instead.
      host: ""
      # -- SMTP relay port
      port: 587
      # -- Envelope From address
      from: ""
      # -- SMTP username (an identifier; the password comes from existingSecret)
      username: ""
    providers:
      discord:
        # -- Discord OAuth2 client id (the client secret comes from existingSecret)
        clientId: ""
    # -- Existing Secret holding the portal's secrets. Read keys (each optional,
    # so one Secret can carry only what you use): `admin-token` guards the admin
    # gRPC surface, `smtp-password` authenticates the mail relay, and
    # `discord-client-secret` is the OAuth2 app secret. A key that is absent
    # leaves that feature off. Empty disables all three.
    existingSecret: ""
    # -- Authenticate game logins against portal accounts: sets
    # login.auth_mode=account, points login at the local AccountService, and
    # turns off login.auto_register (the two conflict — with the portal in
    # charge, accounts are created there, not on first game login). Leave false
    # to keep the standalone login behaviour and run the portal alongside it.
    gameLogin: false

# Workload knobs for SingleBinary mode
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # -- The world process fills to its GC ceiling at ~1.1-1.3Gi under load; 2Gi leaves headroom.
      memory: 2Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    # Only relabel volume contents when the top-level ownership is wrong,
    # so a large PVC is not chowned recursively on every pod start.
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  # -- Liveness probe: tcpSocket on the primary port (world-tcp, or login-grpc
  #    in Management). /healthz is deliberately NOT used for liveness — it
  #    returns 503 during a slow cold-cache boot and must not restart the pod.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
  extraEnv: []
  extraArgs: []

# Workload knobs for Management mode
management:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # -- The world process fills to its GC ceiling at ~1.1-1.3Gi under load; 2Gi leaves headroom.
      memory: 2Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    # Only relabel volume contents when the top-level ownership is wrong,
    # so a large PVC is not chowned recursively on every pod start.
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  # -- Liveness probe: tcpSocket on the primary port (world-tcp, or login-grpc
  #    in Management). /healthz is deliberately NOT used for liveness — it
  #    returns 503 during a slow cold-cache boot and must not restart the pod.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
  extraEnv: []
  extraArgs: []

# Workload knobs for World mode
world:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      # -- The world process fills to its GC ceiling at ~1.1-1.3Gi under load; 2Gi leaves headroom.
      memory: 2Gi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    # Only relabel volume contents when the top-level ownership is wrong,
    # so a large PVC is not chowned recursively on every pod start.
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  # -- Liveness probe: tcpSocket on the primary port (world-tcp, or login-grpc
  #    in Management). /healthz is deliberately NOT used for liveness — it
  #    returns 503 during a slow cold-cache boot and must not restart the pod.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
  extraEnv: []
  extraArgs: []

# Persistent storage (Management + SingleBinary)
persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  annotations: {}

service:
  # -- Service type for the primary Service of this release
  type: ClusterIP
  # -- Annotations for the Service
  annotations: {}

# Ingress for the ondemand HTTP endpoint (SingleBinary / World)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# Ingress for the account portal (Management / SingleBinary, when
# goscape.account.enabled). Kept separate from the ondemand Ingress above:
# the portal is a browser-facing web app on its own hostname, which must match
# goscape.account.publicUrl.
accountIngress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

networkPolicy:
  enabled: false

# Arbitrary extra manifests rendered verbatim (list of objects or template strings)
extraManifests: []

# Kong gateway configuration for the hiscores API.
#
# This renders Kong Ingress Controller CONFIGURATION only (Ingress,
# KongPlugin, KongConsumer). It does NOT install Kong. Kong is a
# prerequisite, installed separately from its own chart, because a
# gateway is cluster-wide infrastructure shared by every service behind
# it rather than a per-application component.
hiscoreGateway:
  createGatewayConfig: false
  host: ""
  ingressClassName: kong
  # When createGatewayConfig is true and networkPolicy.enabled is true, the
  # hiscore port is reachable only from the Kong proxy pods matched below, so
  # in-cluster callers cannot bypass key-auth and rate limits.
  proxyNamespace: kong
  proxyPodSelector:
    app.kubernetes.io/name: kong
  # Consumer used for unauthenticated callers (the website, casual
  # users). key-auth falls back to it instead of rejecting, because
  # hiscore data is public — keys exist for quota and accountability.
  anonymousConsumer: hiscore-anonymous
  rateLimit:
    anonymousPerMinute: 60
    consumerPerMinute: 600
  cacheTTLSeconds: 60
  corsOrigins: []
  # Third-party consumers. Each entry names an EXISTING Secret holding
  # the key-auth credential; key material never lives in values.yaml.
  #   - username: partner-a
  #     credentialSecret: hiscore-partner-a-key
  consumers: []
