# examples/bundled/goscape.yaml
# Example config for the standalone goscape game server.
# Start goscape with: go run ./cmd/goscape --config.file examples/bundled/goscape.yaml
#
# The game server is self-contained: login, friends and hiscore persist to
# one local SQLite central database, so no external services are required.
#
# target: all also covers the `account` module, but it stays off because its
# `enable:` defaults to false — the portal needs an account: block (with a
# public_url) before it will run. See examples/full-config-reference.yaml.
target: all

database:
  backend: sqlite
  sqlite:
    dsn: data/goscape.db

ondemand:
  enable: true
  http_listen_network: tcp
  http_listen_address: 127.0.0.1
  http_listen_port: 8080

login:
  enable: true
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 2004
  save_path: data/players
  node_profile: main
  auto_register: true
  auto_subscribe_members: true

friends:
  enable: true

world:
  enable: true
  tcp_keepalive_period: 30s
  node_debug: false
  friends_server_enabled: true

hiscore:
  enable: true
