# examples/bundled/goscape.yaml
# Example config for the standalone goscape game server.
# Start goscape with: go run ./cmd/goscape --config.file examples/bundled/goscape.yaml
#
# The game server is self-contained: login and friends persist to local SQLite,
# so no external services are required to run it.
target: all

ondemand:
  enable: true
  http_listen_network: tcp
  http_listen_address: 127.0.0.1
  http_listen_port: 8888

login:
  enable: true
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 2004
  sqlite_dsn: data/login.db
  save_path: data/players
  node_profile: main
  auto_register: true
  auto_subscribe_members: true
  graceful_shutdown_timeout: 30s

friends:
  enable: true

world:
  enable: true
  tcp_keepalive_period: 30s
  node_debug: false
  friends_server_enabled: true
