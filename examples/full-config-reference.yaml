# examples/full-config-reference.yaml
# =============================================================================
# goscape — FULL CONFIGURATION REFERENCE
# =============================================================================
# This file documents EVERY configuration key the server understands, each set
# to its built-in default. It is a reference, not a starter config: copy only
# the keys you want to override into your own file. For a minimal working
# preset, see examples/bundled/goscape.yaml.
#
# This file is itself a valid config. Verify it without starting the server:
#   go run ./cmd/goscape --config.file examples/full-config-reference.yaml --config.verify=true
#
# -----------------------------------------------------------------------------
# How configuration is resolved (lowest to highest precedence):
#   1. built-in defaults (the values shown below)
#   2. this config file            (--config.file <path>)
#   3. environment variables       (only when expansion is enabled, see below)
#   4. CLI flags                   (e.g. --world.tcp-listen-port 43594)
#
# Strictness: the loader uses strict YAML decoding. An UNKNOWN key is a fatal
# boot error, not a warning — keep keys exactly as spelled here.
#
# Meta-flags (value flags — the `=true` is required; the bare form errors):
#   --config.file=<path>        config file to load
#   --config.verify=true        validate config and exit (no server start)
#   --config.expand-env=true    expand ${VAR} / $VAR in this file from the
#                               environment before parsing
#
# Env-var expansion: with --config.expand-env=true, any ${VAR} in a value is
# replaced by the environment. Example: dsn: ${GOSCAPE_DB:-data/goscape.db}
#
# NOTE: every value below is the built-in DEFAULT, with one exception — the
# `enable:` keys of ondemand, world, login and friends are set to `true` so this
# file is a coherent "run the game server" config (the code default for each is
# `false`). The two extension modules, `account` and `hiscore`, are left at their
# code default of `false`: neither is needed to run the game, and `account`
# additionally requires `public_url` before it will validate. The two
# event-export modules, `telemetry` and `packetcapture`, spell their switch
# `enabled:` rather than `enable:` and are likewise left off. A module runs only
# when BOTH its switch is true AND it is included by the active `target`.
# =============================================================================


# ----------------------------------------------------------------------------
# Global settings (top level)
# ----------------------------------------------------------------------------

# Which module(s) to run. The selected target pulls in its dependencies, and
# each module in that set still runs only if its own `enable:` is true — e.g.
# `target: world` with `login.enable: true` also starts login in-process.
#   ondemand  HTTP OnDemand server (pulls in world)
#   world     TCP game server (pulls in login, friends)
#   login     gRPC login service
#   friends   friends server
#   account   player portal + AccountService gRPC
#   hiscore   read-only hiscores JSON API
#   all       run everything (default)
# CLI: --target
target: all

# Minimum severity to log. One of: trace | debug | info | warn | error.
# CLI: --log.level   (default: info)
log_level: info

# Log output format. One of: text | json.
# CLI: --log.format   (default: text)
log_format: text

# How the `source` attribute is rendered. One of:
#   relative  module-root-relative path, e.g. modules/world/npc_masks.go:42
#             (stays clickable from the repo root in an IDE) — default
#   short     filename only, e.g. npc_masks.go:42
#   full      the compiler's path: absolute under a plain `go run`, or
#             import-path-rooted under -trimpath builds
# CLI: --log.source   (default: relative)
log_source: relative

# How long to wait between receiving SIGTERM and actually stopping the modules.
# For the whole of this window the process keeps serving players, but /readyz
# answers 503 ("shutting down") and every gRPC server's grpc.health.v1 service
# answers NOT_SERVING — so an orchestrator removes this pod from its Service
# endpoints BEFORE it stops accepting. Pair it with a container
# terminationGracePeriodSeconds comfortably larger than this value plus the
# time the modules themselves need to stop. 0 (the default) stops immediately,
# exactly as before.
# CLI: --shutdown-delay   (default: 0s)
shutdown_delay: 0s


# ----------------------------------------------------------------------------
# admin — supervisor HTTP listener (Kubernetes liveness / readiness probes)
# ----------------------------------------------------------------------------
# A tiny HTTP listener, owned by the process root rather than by any module,
# serving exactly two routes:
#
#   GET /healthz  liveness. Always 200 with the body "ok\n" as soon as the
#                 process is up. It deliberately checks nothing: a process
#                 that is merely not ready must be drained, never
#                 restart-looped.
#   GET /readyz   readiness. 200 with {"status":"ready","modules":{...}}, or
#                 503 with {"status":"not ready","reason":"...","modules":{...}}.
#                 It checks, in order: (1) no shutdown has been requested,
#                 (2) the service manager is built and every module is
#                 Running, (3) the world (when this target runs one) has
#                 completed a recent tick — the same tick-loop check the
#                 ondemand /healthz route uses, except that a world still
#                 inside its 30s boot grace counts as NOT ready here, since a
#                 pod must not receive players before its first tick.
#                 `modules` maps each module in this target to its dskit
#                 state (New/Starting/Running/Stopping/Terminated/Failed).
#
# Why it exists: every goscape module owns its own listener, so a host running
# only `target: login` or `target: friends` serves no HTTP at all and could
# previously be probed no better than with a bare TCP connect. This listener
# gives every target the same probe surface. It is the counterpart of Grafana
# Loki's internal_server.
#
# Kubernetes: livenessProbe -> httpGet /healthz, readinessProbe -> httpGet
# /readyz, both on this port. Bind it INSIDE the pod (":9100" or
# "127.0.0.1:9100") and never expose it through a Service, Ingress or gateway:
# /readyz names the modules this process runs and the state each is in.
#
# gRPC hosts get the same verdict for free: login, friends and account each
# register the standard grpc.health.v1 Health service on their existing gRPC
# port, reporting the health of the WHOLE process (the request's `service`
# field is ignored, as in dskit). grpc_health_probe and service meshes can use
# that with no extra configuration and no extra port.
admin:
  # Address for the admin HTTP listener. Empty (the default) disables it and
  # binds nothing. CLI: --admin.listen
  listen: ""


# ----------------------------------------------------------------------------
# ondemand — HTTP OnDemand server (serves the client cache + /rs2.cgi bootstrap,
#            optional WebSocket -> world bridge)
# ----------------------------------------------------------------------------
ondemand:
  # Run the ondemand module. Code default: false. (yaml-only; no CLI flag.)
  enable: true

  # --- HTTP listener (inlined dskit server.Config) ---
  # CLI: --ondemand.http-listen-network (default: tcp)
  http_listen_network: tcp
  # CLI: --ondemand.http-listen-address (default: 127.0.0.1)
  http_listen_address: 127.0.0.1
  # CLI: --ondemand.http-listen-port (default: 8080)
  http_listen_port: 8080

  # --- HTTP server timeouts (inlined dskit server.Config) ---
  # CLI: --ondemand.graceful-shutdown-timeout (default: 30s)
  graceful_shutdown_timeout: 30s
  # CLI: --ondemand.http-read-timeout (default: 30s)
  http_server_read_timeout: 30s
  # CLI: --ondemand.http-write-timeout (default: 30s)
  http_server_write_timeout: 30s
  # CLI: --ondemand.http-idle-timeout (default: 120s)
  http_server_idle_timeout: 120s

  # --- Source-IP logging (inlined dskit server.Config) ---
  # CLI: --ondemand.log-source-ips-enabled (default: true)
  log_source_ips_enabled: true
  # Header to read the client IP from. Default mirrors the TS getIp() primary.
  # Setting a custom header REPLACES (not augments) dskit's built-in
  # Forwarded / X-Real-IP / X-Forwarded-For chain. Blank both header and regex
  # to fall back to that chain.
  # CLI: --ondemand.log-source-ips-header (default: cf-connecting-ip)
  log_source_ips_header: cf-connecting-ip
  # Regex whose first capture group is the IP. Default extracts the first
  # comma-separated address (TS .split(',')[0].trim()).
  # CLI: --ondemand.log-source-ips-regex
  log_source_ips_regex: '^\s*([^,]+?)\s*(?:,|$)'
  # Log all matched source IPs instead of only the first.
  # CLI: --ondemand.log-source-ips-full (default: false)
  log_source_ips_full: false

  # Cache root; archive and song/map files are served from <path>/client/.
  # CLI: --ondemand.cache-path (default: ./data/pack)
  cache_path: ./data/pack

  # --- Static-file fallback ---
  # Directory served as a static-file fallback after named routes miss.
  # CLI: --ondemand.public-dir (default: ./public)
  public_dir: ./public

  # --- /rs2.cgi bootstrap params (mirror the world module's NODE_* values;
  #     keep these in sync with the world module when running both) ---
  # CLI: --ondemand.node-id (default: 10)
  node_id: 10
  # CLI: --ondemand.node-members (default: true)
  node_members: true
  # World TCP port; rs2.cgi emits portoff = node_port - 43594 to the applet.
  # CLI: --ondemand.node-port (default: 43594)
  node_port: 43594
  # Whether rs2.cgi may serve the Java applet template when plugin=1.
  # CLI: --ondemand.node-debug (default: true)
  node_debug: true

  # Serve GET /debug/status (players online, current tick, tick age) on the
  # public ondemand listener. It is unauthenticated, so it doubles as a load /
  # presence oracle for attackers — leave off unless you front it with auth.
  # CLI: --ondemand.debug-status-enabled (default: false)
  debug_status_enabled: false

  # --- WebSocket -> world bridge ---
  websocket:
    # Serve a WS bridge at "/" that forwards binary frames to the world module's
    # TCP connection handler. CLI: --ondemand.websocket-enable (default: true)
    enable: true
    # Explicit Origin allowlist. Empty => allow all (TS default). Non-empty =>
    # the Origin header must exactly match an entry or the upgrade is rejected.
    # (yaml-only; no CLI flag.)
    allowed_origins: []
    # Max size of a single inbound WS message, in bytes.
    # CLI: --ondemand.websocket-max-payload-bytes (default: 2000)
    max_payload_bytes: 2000

  # --- Advanced dskit server.Config knobs (inlined; no CLI flag; rarely set) ---
  # Per-module log level override (yaml-only; no CLI flag); falls back to the
  # top-level log_level. Valid levels: debug, info, warn, error.
  # (ondemand inherits the dskit HTTP server layer, which does not support trace.)
  #log_level: info
  # HTTP server read-header timeout (default: 0 = no separate header timeout).
  #http_server_read_header_timeout: 0s
  # Log connections closed before any response was written.
  #http_log_closed_connections_without_response_enabled: false
  # Request-header logging / level / exclusions.
  #log_request_headers: false
  #log_request_at_info_level_enabled: false
  #log_request_exclude_headers_list: ""
  # Strip this prefix from incoming request paths before routing.
  #http_path_prefix: ""


# ----------------------------------------------------------------------------
# database — central database shared by login + friends + account + hiscore
# ----------------------------------------------------------------------------
# Central database shared by the login, friends, account and hiscore services.
# Each is an independent client of it with its own pool — with the sqlite
# backend they must share a filesystem; postgres lifts that to a network
# database, letting them run on separate hosts against one database.
database:
  # Backend: sqlite | postgres.
  backend: sqlite
  sqlite:
    # SQLite file path (parent directories are created automatically).
    dsn: data/goscape.db
  postgres:
    # PostgreSQL DSN, e.g. postgres://user:pass@host:5432/goscape?sslmode=disable
    # Required when backend=postgres.
    dsn: ""
    # Max open connections per service pool.
    max_open_conns: 8


# ----------------------------------------------------------------------------
# friends — gRPC friends / private-message server (central database, see
#           database: above)
# ----------------------------------------------------------------------------
friends:
  # Run the friends module. CLI: --friends.enable (code default: false)
  enable: true
  # CLI: --friends.grpc-listen-address (default: 127.0.0.1)
  grpc_listen_address: 127.0.0.1
  # CLI: --friends.grpc-listen-port (default: 2005)
  grpc_listen_port: 2005
  # Per-world player slot cap. CLI: --friends.world-player-limit (default: 2000)
  world_player_limit: 2000
  # Profile name validated at WorldConnect. CLI: --friends.node-profile (default: main)
  node_profile: main
  # CLI: --friends.graceful-shutdown-timeout (default: 30s)
  graceful_shutdown_timeout: 30s
  # Per-module log level override (yaml-only; no CLI flag); falls back to the
  # top-level log_level. Valid levels: trace, debug, info, warn, error.
  #log_level: info


# ----------------------------------------------------------------------------
# login — gRPC login service (account store + player saves; central database,
#         see database: above)
# ----------------------------------------------------------------------------
login:
  # Run the login module. CLI: --login.enable (code default: false)
  enable: true
  # CLI: --login.grpc-listen-address (default: 127.0.0.1)
  grpc_listen_address: 127.0.0.1
  # CLI: --login.grpc-listen-port (default: 2004)
  grpc_listen_port: 2004
  # Player save-file root directory. CLI: --login.save-path (default: data/players)
  save_path: data/players
  # bcrypt work factor for password hashing (valid 4..31).
  # CLI: --login.bcrypt-cost (default: 10)
  bcrypt_cost: 10
  # Profile name used in DB queries. CLI: --login.node-profile (default: main)
  node_profile: main
  # Create accounts on first login. CLI: --login.auto-register (default: true)
  auto_register: true
  # Upgrade non-members to members on member worlds.
  # CLI: --login.auto-subscribe-members (default: true)
  auto_subscribe_members: true
  # CLI: --login.graceful-shutdown-timeout (default: 30s)
  graceful_shutdown_timeout: 30s
  # Credential verification mode. "local" is the TS-faithful path: bcrypt
  # against account.password (with the lowercase quirk), auto_register
  # honored. "account" delegates to the account module's VerifyGameLogin
  # gRPC (character name + portal account password, case-sensitive, no
  # auto-register) — requires account_grpc_address and auto_register: false
  # (auth_mode=account + auto_register=true is a config conflict: accounts
  # are created by the portal, not on first game login).
  # CLI: --login.auth-mode (default: local)
  auth_mode: local
  # AccountService gRPC address (host:port). Required when auth_mode: account.
  # CLI: --login.account-grpc-address (default: "")
  account_grpc_address: ""
  # Per-module log level override (yaml-only; no CLI flag); falls back to the
  # top-level log_level. Valid levels: trace, debug, info, warn, error.
  #log_level: info


# ----------------------------------------------------------------------------
# world — TCP game server (the engine)
# ----------------------------------------------------------------------------
world:
  # Run the world module. (yaml-only; no CLI flag. Code default: false.)
  enable: true

  # --- TCP listener ---
  # CLI: --world.tcp-listen-network (default: tcp)
  tcp_listen_network: tcp
  # CLI: --world.tcp-listen-address (default: 127.0.0.1)
  tcp_listen_address: 127.0.0.1
  # CLI: --world.tcp-listen-port (default: 43594; valid 1..65535)
  tcp_listen_port: 43594

  # --- TCP timeouts ---
  # CLI: --world.tcp-read-timeout (default: 30s)
  tcp_server_read_timeout: 30s
  # CLI: --world.tcp-write-timeout (default: 2s)
  # Per-write deadline for the client's outbound socket writer, and the
  # budget it gets to drain already-queued frames when the connection is
  # closed. Socket writes run on a per-client writer goroutine, never on
  # the world tick goroutine (SEC1 M-2).
  tcp_server_write_timeout: 2s
  # CLI: --world.tcp-idle-timeout (default: 120s)
  tcp_server_idle_timeout: 120s
  # TCP keepalive idle period before the first probe; 0 disables.
  # CLI: --world.tcp-keepalive-period (default: 30s)
  tcp_keepalive_period: 30s
  # CLI: --world.graceful-shutdown-timeout (default: 30s)
  graceful_shutdown_timeout: 30s

  # --- Cache / content ---
  # Cache root; gamemap loads map-pack files from <path>/maps/.
  # CLI: --world.cache-path (default: ./data/pack)
  cache_path: ./data/pack
  # Source content root that enables ::rebuild's in-process PackAll and the midi
  # name->id registry. Empty disables the cheat.
  # CLI: --world.content-path (default: "")
  content_path: ""
  # Watch content_path subdirs and auto-::rebuild on change (debounced 1s).
  # Requires content_path to be set. CLI: --world.content-watch (default: false)
  content_watch: false
  # Optional PEM RSA private key (PKCS#1/PKCS#8) to decrypt the login block,
  # replacing the built-in default key. The Java client must carry the matching
  # public key. Empty uses the built-in key.
  # CLI: --world.rsa-private-key-path (default: "")
  rsa_private_key_path: ""

  # --- Inter-module connections ---
  # CLI: --world.login-server-address (default: 127.0.0.1:2004)
  login_server_address: 127.0.0.1:2004
  # CLI: --world.login-server-enabled (default: true)
  login_server_enabled: true
  # CLI: --world.friends-server-address (default: 127.0.0.1:2005)
  friends_server_address: 127.0.0.1:2005
  # Connect to the friends server. CLI: --world.friends-server-enabled
  # (default: false; the bundled example sets this true to use the friends module)
  friends_server_enabled: false

  # --- Node / gameplay settings (mirror TS Environment NODE_*) ---
  # World ID, offset by 9. CLI: --world.node-id (default: 10)
  node_id: 10
  # Whether members content is available. CLI: --world.node-members (default: true)
  node_members: true
  # Auto-upgrade accounts that log into this world to members.
  # CLI: --world.node-auto-subscribe-members (default: true)
  node_auto_subscribe_members: true
  # addxp multiplier. CLI: --world.node-xp-rate (default: 1)
  node_xp_rate: 1
  # Max live NPCs. CLI: --world.node-max-npcs (default: 8191)
  node_max_npcs: 8191
  # Max connected clients. CLI: --world.node-max-connected (default: 1000)
  node_max_connected: 1000
  # WalkTrigger dispatch mode: 0=PLAYERPACKET (default), 1=PLAYERSETUP,
  # 2=PLAYERMOVEMENT. CLI: --world.node-walk-trigger-setting (default: 0)
  node_walktrigger_setting: 0
  # Min wealth value for the wealth event. CLI: --world.node-minimum-wealth-value-event (default: 10)
  node_minimum_wealth_value_event: 10
  # Run in production mode (gates the login rate limits below).
  # CLI: --world.node-production (default: false)
  node_production: false
  # Max login attempts per remote IP in a sliding 60s window (production only;
  # 0 disables). CLI: --world.node-rate-limit-address-login (default: 30)
  node_rate_limit_address_login: 30
  # Max login attempts per uid@IP in a sliding 15s window (production only;
  # 0 disables). CLI: --world.node-rate-limit-device-login (default: 5)
  node_rate_limit_device_login: 5
  # --- Client input-tracking ---
  # Whether clients are instructed to submit detailed input-tracking events.
  # CLI: --world.node-submit-input (default: false)
  node_submit_input: false
  # Max approximate bytes per single input-tracking session.
  # CLI: --world.node-limit-bytes-per-tracking-session (default: 50000)
  node_limit_bytes_per_tracking_session: 50000

  # --- Debug / dev ---
  # Extra debug info (e.g. missing triggers). CLI: --world.node-debug (default: true)
  node_debug: true
  # Client-side route finding. CLI: --world.node-client-route-finder (default: true)
  node_client_routefinder: true
  # Prefix char for ::debugproc cheats. CLI: --world.node-debugproc-char (default: ~)
  node_debugproc_char: '~'
  # Profile name. CLI: --world.node-profile (default: main)
  node_profile: main
  # CLI: --world.node-debug-profile (default: false)
  node_debug_profile: false
  # CLI: --world.node-debug-socket (default: false)
  node_debug_socket: false

  # --- Advanced / rarely set ---
  # Per-module log level override (yaml-only; no CLI flag); falls back to the
  # top-level log_level. Valid levels: trace, debug, info, warn, error.
  #log_level: info
  # TCP read-header timeout (yaml-only; default: 0 = none).
  #tcp_server_read_header_timeout: 0s

  # --- Deprecated / unused (accepted but read by no live code path) ---
  # Unused: nothing reads this field; the player cap is hardcoded (newPlayerList(2048)).
  #node_max_players: 2047
  # Declared but consumed by no code path.
  #enable_tcp_server: false


# ----------------------------------------------------------------------------
# account — portal accounts (SSR web app) + AccountService gRPC surface
#           consumed by the login module and goscape-cli
# ----------------------------------------------------------------------------
account:
  # Run the account module. CLI: --account.enable (code default: false)
  enable: false
  # Per-module log level override (yaml-only; no CLI flag); falls back to the
  # top-level log_level. Valid levels: trace, debug, info, warn, error.
  #log_level: info
  # CLI: --account.http-listen-address (default: 127.0.0.1)
  http_listen_address: 127.0.0.1
  # CLI: --account.http-listen-port (default: 8081)
  http_listen_port: 8081
  # CLI: --account.grpc-listen-address (default: 127.0.0.1)
  grpc_listen_address: 127.0.0.1
  # CLI: --account.grpc-listen-port (default: 2006)
  grpc_listen_port: 2006
  # Externally reachable portal base URL (email links, OAuth redirect). No
  # trailing slash. Required when account.enable=true.
  # CLI: --account.public-url (default: "")
  public_url: ""
  # Maximum characters per portal account.
  # CLI: --account.character-limit (default: 5)
  character_limit: 5
  # Bearer token guarding the admin gRPC surface. Empty disables every admin
  # RPC. YAML-only (secret); no CLI flag.
  admin_token: ""
  # Character-creation gate: an account may create characters iff it is
  # active, email-verified, under the character limit, AND (member of
  # manually_approved OR holds a non-revoked identity whose provider is
  # listed here). Empty = manual approval only. YAML-only (list); no CLI flag.
  gate:
    providers:
      - discord
  # argon2id password hashing parameters (RFC 9106).
  argon2:
    # CLI: --account.argon2-memory-kib (default: 65536)
    memory_kib: 65536
    # CLI: --account.argon2-time (default: 2)
    time: 2
    # CLI: --account.argon2-parallelism (default: 1)
    parallelism: 1
  # Portal cookie session bounds: a session expires idle_ttl after last use,
  # and unconditionally absolute_ttl after login.
  session:
    # CLI: --account.session-idle-ttl (default: 168h)
    idle_ttl: 168h
    # CLI: --account.session-absolute-ttl (default: 720h)
    absolute_ttl: 720h
  # SMTP relay for verification/reset email. Empty host disables outbound
  # mail (links are logged instead).
  smtp:
    # CLI: --account.smtp-host (default: "")
    host: ""
    # CLI: --account.smtp-port (default: 587)
    port: 587
    # CLI: --account.smtp-from (default: "")
    from: ""
    # YAML-only (secret); no CLI flag.
    username: ""
    # YAML-only (secret); no CLI flag.
    password: ""
  # Third-party identity provider OAuth2 app credentials. YAML-only; no CLI
  # flags (secret-adjacent / secret).
  providers:
    discord:
      client_id: ""
      client_secret: ""


# ----------------------------------------------------------------------------
# hiscore — hiscores read API. Serves public JSON leaderboards over the
#           hiscore tables that the login module populates on logout.
#           Designed to sit behind an API gateway (Kong) which owns
#           authentication and per-consumer rate limiting; this module is
#           anonymous-safe on its own.
# ----------------------------------------------------------------------------
hiscore:
  # CLI: --hiscore.enable (default: false)
  enable: false
  # Default profile queried when a request does not specify one.
  # CLI: --hiscore.profile (default: main)
  profile: main
  # Cache-Control max-age on API responses. Responses are also ETag'd.
  # CLI: --hiscore.cache-max-age (default: 1m)
  cache_max_age: 1m
  # CLI: --hiscore.default-limit (default: 25)
  default_limit: 25
  # CLI: --hiscore.max-limit (default: 100)
  max_limit: 100
  # Deepest rank reachable by offset paging. Cursor paging is unbounded
  # and is the intended mechanism for bulk reads.
  # CLI: --hiscore.leaderboard-max-rank (default: 500000)
  leaderboard_max_rank: 500000
  # Read gateway-supplied X-Consumer-* headers for logging. Nothing is
  # ever authorized by them; leave false unless a gateway fronts this.
  # Enabling this WITHOUT a real gateway in front lets any caller set its
  # own X-Consumer-Username to mint a fresh rate-limit bucket per request,
  # silently defeating the backstop_rate below (no data/access is at risk
  # since nothing is authorized by the header — the limiter just stops
  # limiting, with no signal that it happened).
  # CLI: --hiscore.trust-gateway-headers (default: false)
  trust_gateway_headers: false
  # Coarse in-process requests/minute per caller, for when no gateway
  # limits apply. 0 disables. CLI: --hiscore.backstop-rate (default: 120)
  backstop_rate: 120

  # --- HTTP listener (inlined dskit server.Config) ---
  # CLI: --hiscore.http-listen-network (default: tcp)
  http_listen_network: tcp
  # CLI: --hiscore.http-listen-address (default: 127.0.0.1)
  http_listen_address: 127.0.0.1
  # CLI: --hiscore.http-listen-port (default: 8082)
  http_listen_port: 8082

  # --- HTTP server timeouts (inlined dskit server.Config) ---
  # CLI: --hiscore.graceful-shutdown-timeout (default: 30s)
  graceful_shutdown_timeout: 30s
  # CLI: --hiscore.http-read-timeout (default: 30s)
  http_server_read_timeout: 30s
  # CLI: --hiscore.http-write-timeout (default: 30s)
  http_server_write_timeout: 30s
  # CLI: --hiscore.http-idle-timeout (default: 120s)
  http_server_idle_timeout: 120s

  # --- Source-IP logging (inlined dskit server.Config) ---
  # CLI: --hiscore.log-source-ips-enabled (default: true)
  log_source_ips_enabled: true
  # Both header and regex blank selects dskit's built-in Forwarded /
  # X-Real-IP / X-Forwarded-For chain, which is what Kong populates —
  # deliberately unlike ondemand, which defaults to cf-connecting-ip for
  # its Cloudflare-fronted deployment.
  # CLI: --hiscore.log-source-ips-header (default: "")
  log_source_ips_header: ""
  # CLI: --hiscore.log-source-ips-regex (default: "")
  log_source_ips_regex: ""
  # Log all matched source IPs instead of only the first.
  # CLI: --hiscore.log-source-ips-full (default: false)
  log_source_ips_full: false
  # Per-module log level override (yaml-only; no CLI flag); falls back to the
  # top-level log_level. Valid levels: trace, debug, info, warn, error.
  #log_level: info


# ----------------------------------------------------------------------------
# telemetry — OpenTelemetry providers + optional Kafka event export
# ----------------------------------------------------------------------------
# An invisible module: it is never a `target`, it is pulled in by login and
# world, and it runs whenever its own `enabled:` is true. Enabling it boots the
# global OTel meter / tracer / logger providers and, when `kafka.brokers` is
# non-empty, installs the buffering Emitter that the engine's emit call sites
# (login, world, wealth) write to. With `brokers` left empty the module is
# otlp-only: metrics, traces and logs are exported, no Kafka client is created,
# and events keep landing in the built-in no-op sink. Disabled — the default —
# there are no providers, no Emitter and no Kafka client at all.
#
# NOTE: the switch is spelled `enabled:` here, not `enable:` as the game
# modules above spell it.
telemetry:
  # CLI: --telemetry.enabled (default: false)
  enabled: false

  kafka:
    # Seed brokers (host:port). Empty selects otlp-only mode, above; at least
    # one entry is required to export events. (yaml-only; no CLI flag.)
    brokers: []
    # CLI: --telemetry.kafka.client-id (default: goscape)
    client_id: goscape

  otlp:
    # OTLP gRPC collector endpoint; required whenever the module is enabled.
    # CLI: --telemetry.otlp.endpoint (default: localhost:4317)
    endpoint: localhost:4317
    # Connect to the collector without TLS.
    # CLI: --telemetry.otlp.insecure (default: true)
    insecure: true
    # Trace sampling ratio, in [0.0, 1.0].
    # CLI: --telemetry.otlp.sample-ratio (default: 0.01)
    sample_ratio: 0.01

  # Capacity of the in-process event buffer. It drops the oldest record when
  # full, so an unreachable broker costs events, never game ticks.
  # CLI: --telemetry.ring-buffer-size (default: 65536)
  ring_buffer_size: 65536
  # Cadence at which the shipper drains that buffer into Kafka.
  # CLI: --telemetry.drain-interval (default: 10ms)
  drain_interval: 10ms
  # Maximum records drained per tick.
  # CLI: --telemetry.drain-batch-max (default: 1024)
  drain_batch_max: 1024
  # Budget for the final flush at shutdown.
  # CLI: --telemetry.stop-timeout (default: 5s)
  stop_timeout: 5s


# ----------------------------------------------------------------------------
# packetcapture — optional wire-packet export to Kafka (pkg/tapper implementation)
# ----------------------------------------------------------------------------
# An invisible module pulled in by world. Enabled, it supplies the Tapper the
# world module hands every inbound and outbound game packet to, encodes them as
# events.v1 envelopes and ships them to Kafka. Disabled — the default — world
# gets the built-in no-op Tapper and the tap costs one interface call per
# packet. Like telemetry, the switch is spelled `enabled:`.
packetcapture:
  # CLI: --packetcapture.enabled (default: false)
  enabled: false
  # Wire-protocol revision stamped on captured packets. Must equal the revision
  # this binary speaks (225 on this branch) or startup fails: a capture tagged
  # with a revision the decoder does not speak cannot be read back.
  # CLI: --packetcapture.revision (default: 225)
  revision: 225
  # Capacity of the capture buffer (valid 1..1048576). Drops the oldest record
  # when full, so an unreachable broker never stalls the world tick.
  # CLI: --packetcapture.ring-buffer-size (default: 65536)
  ring_buffer_size: 65536
  # Cadence at which the shipper drains that buffer into Kafka.
  # CLI: --packetcapture.drain-interval (default: 10ms)
  drain_interval: 10ms
  # Maximum records drained per tick.
  # CLI: --packetcapture.drain-batch-max (default: 1024)
  drain_batch_max: 1024
  # Budget for the final flush at shutdown.
  # CLI: --packetcapture.stop-timeout (default: 5s)
  stop_timeout: 5s
  # World ID stamped on captured packets. Accepted but inert: the value is
  # taken from world.node_id at startup. (yaml-only; no CLI flag.)
  world_id: 0
  kafka:
    # Seed brokers (host:port). Empty inherits telemetry.kafka.brokers, so on a
    # server that already exports events the only knob to flip is
    # packetcapture.enabled. (yaml-only; no CLI flag.)
    brokers: []
    # CLI: --packetcapture.kafka.client-id (default: goscape)
    client_id: goscape
    # Destination topic. Consumers are keyed on this name; change it only
    # together with them.
    # CLI: --packetcapture.kafka.topic (default: events.replay_packets)
    topic: events.replay_packets
