# Per-revision inputs for docsgen and build.py.
#
# content_dir / cache_dir / jag_dir / client_worktree are resolved against the
# SOURCE ROOT: the directory holding the `zsrv/` and `LostCityRS/` checkouts.
# It defaults to two levels above this repository (so a standard
# <root>/zsrv/goscape layout needs no configuration) and can be pointed
# anywhere with the GOSCAPE_SRC_ROOT environment variable. Keeping these
# relative is what lets docsgen run on a machine that is not the author's.
order = ["225", "244", "245.2", "254", "274"]
latest = "274"

[revisions.225]
branch = "rev-225"
unpack_revision = 225
# No rev-225 client cache exists (that era's pack pipeline shipped .jag
# archives, not main_file_cache.*) and goscape-cli's `unpack` verb postdates
# this revision, so item/npc/loc/varp data is parsed straight from the pinned
# content tree: every named *.obj/*.npc/*.loc/*.varp script file plus the
# upstream scripts/_unpack staging dumps (the two sets are disjoint and
# together cover the full config space).
config_source = "content-tree"
note = "Item/NPC/location/varp data parsed from the pinned rev-225 content tree (no rev-225 client cache exists and the unpack tooling postdates this revision); counts include every *.obj/*.npc/*.loc/*.varp file under the content tree's scripts/ directory, including the scripts/_unpack staging dumps, whereas later revisions count every entry decoded from the packed client cache."
content_dir = "LostCityRS/Server225_2/content"

[revisions.244]
branch = "rev-244"
unpack_revision = 244
content_dir = "LostCityRS/Server244-ref/content"
cache_dir = "LostCityRS/Server244-ref/unpack-ref/cache"

[revisions."245.2"]
branch = "rev-245.2"
unpack_revision = 245
content_dir = "LostCityRS/Server245.2-ref/content"
cache_dir = "LostCityRS/Server245.2-ref/unpack-ref/cache"

[revisions.254]
branch = "rev-254"
unpack_revision = 254
content_dir = "LostCityRS/Server254-ref/content"
cache_dir = "LostCityRS/Server254-ref/unpack-ref/cache"

[revisions.274]
branch = "rev-274"
unpack_revision = 274
content_dir = "LostCityRS/Server274-ref/content"
cache_dir = "LostCityRS/Server274-ref/unpack-ref/cache"

# Item-icon rasterizer, all five revisions. client_worktree/client_branch
# are declarative: each points at the persistent sibling goscape-client
# checkout already on that revision's branch (docsgen only asserts the
# match — SystemExit if not — it never mutates these worktrees). Every
# revision but 225 loads a classic on-disk cache (cache_dir, -cache); 225
# predates that cache format (jag-era pack pipeline) so it sets jag_dir
# instead (-jag-dir) — icons.render_icons requires exactly one of the two.
[revisions.225.icons]
enabled = true
client_worktree = "zsrv/goscape-client-rev225"
client_branch = "rev-225"
jag_dir = "LostCityRS/Server225_2/engine/data/pack/client"

[revisions.244.icons]
enabled = true
client_worktree = "zsrv/goscape-client-rev244"
client_branch = "rev-244"
cache_dir = "LostCityRS/Server244-ref/unpack-ref/cache"

[revisions."245.2".icons]
enabled = true
client_worktree = "zsrv/goscape-client-rev245.2"
client_branch = "rev-245.2"
cache_dir = "LostCityRS/Server245.2-ref/unpack-ref/cache"

[revisions.254.icons]
enabled = true
client_worktree = "zsrv/goscape-client-rev254"
client_branch = "rev-254"
cache_dir = "LostCityRS/Server254-ref/unpack-ref/cache"

[revisions.274.icons]
enabled = true
client_worktree = "zsrv/goscape-client"
client_branch = "rev-274"
cache_dir = "LostCityRS/Server274-ref/unpack-ref/cache"
