target: all
log_level: debug
log_format: text

ondemand:
  enable: true
  http_listen_network: tcp
  http_listen_address: 127.0.0.1
  http_listen_port: 8888

login:
  enable: true
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 2004
  sqlite_dsn: data/login.db
  save_path: data/players
  node_profile: main
  auto_register: true
  auto_subscribe_members: true
  graceful_shutdown_timeout: 30s

friends:
  enable: true


world:
  enable: true
  tcp_keepalive_period: 30s
  node_debug: false
  friends_server_enabled: true
  # Source content root: enables the midi name->id registry (in-game music)
  # and the ::rebuild cheat. Mirrors TS BUILD_SRC_DIR (../content).
  content_path: /home/owner/Code/github.com/LostCityRS/Server274-ref/content
  # Optional: PEM-encoded RSA private key (PKCS#1 or PKCS#8) used to decrypt
  # the login block, replacing the built-in default key. The Java client must
  # be rebuilt with the matching public key (Client.java LOGIN_RSAN /
  # LOGIN_RSAE). Generate a keypair and print the bake values with:
  #   goscape-cli rsa gen --bits 1024 --out-dir data/config
  # Leave unset to use the built-in default key.
  #rsa_private_key_path: data/config/private.pem
