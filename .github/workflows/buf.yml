# .github/workflows/buf.yml
name: buf

on:
  pull_request:
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - ".github/workflows/buf.yml"
  push:
    branches: ['rev-*']

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # buf breaking needs history
      # No breaking_against: the action already defaults to the pull request's
      # base, or to the commit before a push. That is what this repository
      # wants, because each rev-N branch is an independent port whose schema
      # evolves on its own — comparing every branch against rev-225, as this
      # workflow used to, asked "does this differ from the oldest revision?"
      # rather than "does this pull request break the branch it targets?".
      - uses: bufbuild/buf-action@v1
