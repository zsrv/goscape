# .github/workflows/buf.yml
name: buf

on:
  pull_request:
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - ".github/workflows/buf.yml"
  push:
    branches: ['rev-*']

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # buf breaking needs history
      - uses: bufbuild/buf-action@v1
        with:
          # main is the codeless docs hub; the proto schema lives on the
          # revision branches. Bump this when cutting a new rev-N branch.
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=rev-225,subdir=."
