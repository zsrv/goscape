syntax = "proto3";
package friends.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/zsrv/goscape/pkg/friendspb";

service FriendsService {
  // Lifecycle. Called once per world on startup; validates profile and
  // initializes the world's player-count slot. Mirrors TS FriendServer
  // WORLD_CONNECT opcode (FriendServer.ts:89-106).
  rpc WorldConnect(WorldConnectRequest) returns (google.protobuf.Empty);

  // Player presence. Mirrors TS PLAYER_LOGIN/PLAYER_LOGOUT/PLAYER_CHAT_SETMODE.
  rpc PlayerLogin(PlayerLoginRequest)     returns (PlayerLoginResponse);
  rpc PlayerLogout(PlayerLogoutRequest)   returns (google.protobuf.Empty);
  rpc ChatSetMode(ChatSetModeRequest)     returns (google.protobuf.Empty);

  // Social-list mutations. Mirrors TS FRIENDLIST_ADD/DEL, IGNORELIST_ADD/DEL.
  rpc FriendlistAdd(FriendlistAddRequest) returns (google.protobuf.Empty);
  rpc FriendlistDel(FriendlistDelRequest) returns (google.protobuf.Empty);
  rpc IgnorelistAdd(IgnorelistAddRequest) returns (google.protobuf.Empty);
  rpc IgnorelistDel(IgnorelistDelRequest) returns (google.protobuf.Empty);

  // Chat. Mirrors TS PRIVATE_MESSAGE. Server persists then delivers via
  // SubscribeUpdates fan-out; insert error → codes.Internal.
  rpc PrivateMessage(PrivateMessageRequest) returns (google.protobuf.Empty);

  // Public-chat audit log. Mirrors TS FriendServer.ts:286-297 @2e3bcf43
  // — append-only persistence keyed by session_uuid (rev-254 A3 re-key:
  // TS keyed back from username to session_uuid; goscape additionally
  // keeps profile + world, see PublicMessageRequest).
  // No delivery half; the world handles in-world chat propagation itself.
  // Insert error → codes.Internal.
  rpc PublicMessage(PublicMessageRequest) returns (google.protobuf.Empty);

  // Server -> world push. Server streams update events for a single
  // (world, player) subscription. Backed by a per-profile, per-subscriber
  // registry with broadcastWorldToFollowers fan-out on mutating RPCs.
  // rev-244: profile-scoped registries; each profile is an isolated
  // namespace (FriendServer.ts:546-722).
  rpc SubscribeUpdates(SubscribeUpdatesRequest) returns (stream FriendsUpdate);

  // Cross-world admin relay. Each RPC accepts a target_world_id; the
  // server forwards a WorldEvent to that world's SubscribeWorldEvents
  // stream. No-op if no world is subscribed for target_world_id (matches
  // TS FriendServer.ts:298-302 `if (typeof this.socketByWorld[nodeId] !== 'undefined')`).
  // NAI-S5A-D-NO-ADMIN-AUTH-AT-SERVER — friends-server is dumb routing;
  // admin checks live on both sender and receiver world.
  rpc RelayMute(RelayMuteRequest)                 returns (google.protobuf.Empty);
  rpc RelayKick(RelayKickRequest)                 returns (google.protobuf.Empty);
  rpc RelayShutdown(RelayShutdownRequest)         returns (google.protobuf.Empty);
  rpc RelayBroadcast(RelayBroadcastRequest)       returns (google.protobuf.Empty);
  rpc RelayTrack(RelayTrackRequest)               returns (google.protobuf.Empty);
  rpc RelayReload(RelayReloadRequest)             returns (google.protobuf.Empty);
  rpc RelayClearLogins(RelayClearLoginsRequest)   returns (google.protobuf.Empty);
  rpc RelayClearLogouts(RelayClearLogoutsRequest) returns (google.protobuf.Empty);
  rpc RelayQueueScript(RelayQueueScriptRequest)   returns (google.protobuf.Empty);

  // Server -> world push for cross-world admin events. One subscriber per
  // world (owned by world.Server); the world-side dispatcher applies
  // world-state effects on inbound events. rev-244: profile-scoped
  // registries; each profile is an isolated namespace
  // (FriendServer.ts:546-722).
  // NAI-S5A-D-PERWORLD-EVENTS-STREAM-SEPARATE — second stream RPC
  // alongside SubscribeUpdates; goscape has two parallel streams where
  // TS has one socket. Permanent; reviewer traceability only.
  rpc SubscribeWorldEvents(SubscribeWorldEventsRequest) returns (stream WorldEvent);
}

message WorldConnectRequest {
  int32  world_id = 1;
  string profile  = 2;
}

message PlayerLoginRequest {
  int32  world_id     = 1;
  uint64 username37   = 2;
  int32  private_chat = 3;
  int32  staff_lvl    = 4;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile      = 5;
}

message PlayerLoginResponse {
  // Per-RPC player-cap surfacing. Set false on cap rejection so the
  // world-side caller can warn-log.
  bool accepted = 1;
}

message PlayerLogoutRequest {
  int32  world_id   = 1;
  uint64 username37 = 2;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile    = 3;
}

message ChatSetModeRequest {
  int32  world_id     = 1;
  uint64 username37   = 2;
  int32  private_chat = 3;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile      = 4;
}

message FriendlistAddRequest {
  int32  world_id          = 1;
  uint64 username37        = 2;
  uint64 target_username37 = 3;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile           = 4;
}

message FriendlistDelRequest {
  int32  world_id          = 1;
  uint64 username37        = 2;
  uint64 target_username37 = 3;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile           = 4;
}

message IgnorelistAddRequest {
  int32  world_id          = 1;
  uint64 username37        = 2;
  uint64 target_username37 = 3;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile           = 4;
}

message IgnorelistDelRequest {
  int32  world_id          = 1;
  uint64 username37        = 2;
  uint64 target_username37 = 3;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile           = 4;
}

message PrivateMessageRequest {
  int32  world_id          = 1;
  uint64 username37        = 2;
  uint64 target_username37 = 3;
  int32  staff_lvl         = 4;
  uint32 pm_id             = 5;
  string chat              = 6;
  int32  coord             = 7;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile           = 8;
}

message PublicMessageRequest {
  int32  world_id     = 1;
  // rev-254 A3: re-keyed back from username to the per-login session
  // UUID (TS World.logPublicChat posts session_uuid, World.ts:1567-1574
  // @2e3bcf43; FriendServer.ts:286-297 @2e3bcf43 persists it directly,
  // no account resolution). Same field number as the 244-era
  // `username` (wire-compatible string rename).
  string session_uuid = 2;
  int32  coord        = 3;
  string chat         = 4;
  // rev-244: per-message profile (multi-profile server). TS 254 drops
  // profile/world from the public_chat row because session_uuid joins
  // back to the login DB session table; goscape's federated friends DB
  // has no session table, so the request keeps both for recoverability.
  string profile      = 5;
}

message SubscribeUpdatesRequest {
  int32  world_id   = 1;
  uint64 username37 = 2;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile    = 3;
}

message FriendsUpdate {
  oneof update {
    FriendlistUpdate       friendlist      = 1;
    IgnorelistUpdate       ignorelist      = 2;
    PrivateMessageDelivery private_message = 3;
  }
}

message FriendlistUpdate {
  // (world_id, username37) pairs. world_id=0 means offline/hidden.
  repeated FriendEntry entries = 1;
}

message FriendEntry {
  int32  world_id   = 1;
  uint64 username37 = 2;
}

message IgnorelistUpdate {
  repeated uint64 username37 = 1;
}

message PrivateMessageDelivery {
  uint64 from_username37 = 1;
  int32  staff_lvl       = 2;
  uint32 pm_id           = 3;
  string chat            = 4;
}

// Slice 5a RELAY_* request messages. Each carries target_world_id (the
// world that should RECEIVE the event) plus opcode-specific payload.

message RelayMuteRequest {
  int32  target_world_id = 1;
  uint64 username37      = 2;
  // Mute expiry as epoch milliseconds (matches TS `muted_until: number`).
  // 0 = unmute. Negative = permanent (matches existing modules/login
  // PlayerMute semantics).
  int64  muted_until_ms  = 3;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile         = 4;
}

message RelayKickRequest {
  int32  target_world_id = 1;
  uint64 username37      = 2;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile         = 3;
}

message RelayShutdownRequest {
  int32  target_world_id = 1;
  // Shutdown countdown in ticks (TS `duration`).
  int32  duration_ticks  = 2;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile         = 3;
}

message RelayBroadcastRequest {
  int32  target_world_id = 1;
  // Game-wide chat broadcast text (TS `broadcast` → `message`).
  string message         = 2;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile         = 3;
}

message RelayTrackRequest {
  int32  target_world_id = 1;
  uint64 username37      = 2;
  // TS-faithful `state` (FriendServer.ts:348). Untyped in TS; pinned as
  // int32 so slice 5b can interpret per the anti-cheat tracking subsystem.
  int32  state           = 3;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile         = 4;
}

message RelayReloadRequest {
  int32  target_world_id = 1;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile         = 2;
}

message RelayClearLoginsRequest {
  int32  target_world_id = 1;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile         = 2;
}

message RelayClearLogoutsRequest {
  int32  target_world_id = 1;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile         = 2;
}

message RelayQueueScriptRequest {
  int32  target_world_id = 1;
  string script_name     = 2;
  uint64 username37      = 3;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile         = 4;
}

message SubscribeWorldEventsRequest {
  int32  world_id = 1;
  // rev-244: per-message profile (multi-profile server, FriendServer.ts:546-722).
  string profile  = 2;
}

// WorldEvent is the inbound push variant pushed to a world's
// SubscribeWorldEvents stream. Each variant strips target_world_id from
// the corresponding Relay*Request: the receiving world already knows
// its own ID, and the routing field is irrelevant to the action layer.
message WorldEvent {
  oneof event {
    MuteEvent           mute          = 1;
    KickEvent           kick          = 2;
    ShutdownEvent       shutdown      = 3;
    BroadcastEvent      broadcast     = 4;
    TrackEvent          track         = 5;
    ReloadEvent         reload        = 6;
    ClearLoginsEvent    clear_logins  = 7;
    ClearLogoutsEvent   clear_logouts = 8;
    QueueScriptEvent    queue_script  = 9;
  }
}

message MuteEvent {
  uint64 username37     = 1;
  int64  muted_until_ms = 2;
}

message KickEvent {
  uint64 username37 = 1;
}

message ShutdownEvent {
  int32 duration_ticks = 1;
}

message BroadcastEvent {
  string message = 1;
}

message TrackEvent {
  uint64 username37 = 1;
  int32  state      = 2;
}

message ReloadEvent {}

message ClearLoginsEvent {}

message ClearLogoutsEvent {}

message QueueScriptEvent {
  string script_name = 1;
  uint64 username37  = 2;
}
